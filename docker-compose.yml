services:
  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx
    env_file:
      - .env
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/app/public:/var/www/html/public/storage:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    env_file:
      - .env
    # environment:
    #   DB_HOST: db
    volumes:
      - ./docker/app/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./storage/app:/var/www/html/storage/app:rw
    ports:
      - "${REVERB_PORT}:8080"
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - ./storage/db:/var/lib/postgresql/data

  # db-my:
  #   image: mysql:8.0
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_DATABASE: ${DB_DATABASE}
  #     MYSQL_USER: ${DB_USERNAME}
  #     MYSQL_PASSWORD: ${DB_PASSWORD}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./storage/db:/var/lib/mysql

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
        MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
        MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    ports:
        - "9000:9000"
        - "9001:9001"
    volumes:
        - ./storage/minio:/data:rw

  redis:
    image: redis
    restart: unless-stopped
    ports:
        - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
